<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Display</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        @keyframes scroll-y {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-50%);
            }
        }

        .pause-scroll:hover {
            animation-play-state: paused;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 overflow-hidden font-sans flex flex-col h-screen">
    <!-- Header -->
    <div class="p-6 border-b-4 border-orange-500 flex justify-between items-center bg-white shadow-md z-10">
        <div class="flex items-center gap-4">
            <img src="/static/FTIK-USM-Color.png" alt="Logo" class="h-12 w-auto object-contain" />
            <h1 class="text-3xl font-bold tracking-widest text-slate-800 border-l border-slate-300 pl-4 ml-2">MONITORING
            </h1>
        </div>
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-6 text-3xl font-bold tracking-wide">
                <div id="date" class="text-slate-800 uppercase">MEMUAT TANGGAL...</div>
                <div class="text-slate-300 font-light">|</div>
                <div id="clock" class="text-orange-500 tabular-nums">00:00:00</div>
            </div>
            <button id="btn-fullscreen"
                class="p-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition-all shadow-sm flex items-center justify-center cursor-pointer"
                title="Toggle Fullscreen">
                <i id="fullscreen-icon" data-feather="maximize" class="w-6 h-6"></i>
            </button>
        </div>
    </div>

    <!-- Display Body Container -->
    <div class="flex-1 flex flex-col bg-slate-50 overflow-hidden relative">
        <div class="w-full overflow-hidden flex flex-col h-full border border-slate-200 rounded-2xl shadow-lg bg-white">
            <!-- Fixed Table Header -->
            <table class="w-full text-left border-collapse table-fixed z-20 bg-slate-100">
                <thead>
                    <tr class="border-b border-slate-200">
                        <th class="w-32 py-2 text-2xl font-black text-slate-700 uppercase tracking-wider text-center">
                            FOTO</th>
                        <th class="w-1/2 py-2 px-6 text-2xl font-black text-slate-700 uppercase tracking-wider">NAMA
                        </th>
                        <th class="py-2 px-6 text-2xl font-black text-slate-700 uppercase tracking-wider text-center">
                            TERAKHIR TERLIHAT</th>
                        <th class="py-2 px-6 text-2xl font-black text-slate-700 uppercase tracking-wider text-center">
                            CCTV</th>
                        <th
                            class="w-48 py-2 px-6 text-2xl font-black text-slate-700 uppercase tracking-wider text-center">
                            STATUS</th>
                    </tr>
                </thead>
            </table>

            <!-- Scrolling Rows -->
            <div id="scroll-container" class="flex-1 overflow-hidden relative bg-white">
                <div id="content-wrapper" class="w-full">
                    <table id="data-table" class="w-full text-left border-collapse table-fixed">
                        <tbody id="users-table-body" class="divide-y divide-slate-200">
                            <tr>
                                <td colspan="5" class="px-6 py-12 text-center text-2xl font-bold text-slate-400">
                                    LOADING DATA...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Update clock and date
        function updateDateTime() {
            const now = new Date();
            // Format time: hh.mm.ss or hh:mm:ss
            document.getElementById('clock').textContent = now.toLocaleTimeString('id-ID');

            // Format date: Hari, Tanggal Bulan Tahun (e.g. Senin, 8 Juni 2026)
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('id-ID', options);
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        // Update relative times locally every 30 seconds to prevent stale text
        setInterval(() => {
            const now = new Date();
            document.querySelectorAll('.relative-time-text').forEach(el => {
                const dateStr = el.getAttribute('data-time');
                if (!dateStr) return;

                const date = new Date(dateStr);
                const diffInSeconds = Math.floor((now - date) / 1000);

                let relativeText = '';
                if (diffInSeconds < 60) {
                    relativeText = 'Baru saja';
                } else if (diffInSeconds < 3600) {
                    const minutes = Math.floor(diffInSeconds / 60);
                    relativeText = `${minutes} menit yang lalu`;
                } else {
                    const hours = Math.floor(diffInSeconds / 3600);
                    relativeText = `${hours} jam yang lalu`;
                }
                el.textContent = `(${relativeText})`;
            });
        }, 30000);

        async function loadUsers() {
            try {
                // Fetch all registered users
                const usersRes = await fetch('/api/civitas');
                if (!usersRes.ok) throw new Error('Failed to fetch users');
                const usersData = await usersRes.json();

                // Fetch detection logs
                const logsRes = await fetch('/api/detection-logs');
                if (!logsRes.ok) throw new Error('Failed to fetch logs');
                const logsData = await logsRes.json();

                const todayStr = new Date().toDateString();

                // Filter logs to today only
                const todaysLogs = logsData.filter(log => new Date(log.last_seen).toDateString() === todayStr);

                // Map of user_id -> latest log
                const userLogsMap = {};

                todaysLogs.forEach(log => {
                    if (log.lecture_id !== null) {
                        if (!userLogsMap[log.lecture_id]) {
                            userLogsMap[log.lecture_id] = log;
                        } else {
                            if (new Date(log.last_seen) > new Date(userLogsMap[log.lecture_id].last_seen)) {
                                userLogsMap[log.lecture_id] = log;
                            }
                        }
                    }
                });

                let displayItems = [];

                // Add all registered users
                usersData.forEach(user => {
                    const log = userLogsMap[user.id];
                    if (log) {
                        displayItems.push({
                            type: 'known',
                            name: user.name,
                            last_snapshot_path: log.last_snapshot_path,
                            last_seen: log.last_seen,
                            camera: log.cctv ? log.cctv.name : 'Kamera ' + log.cctv_id,
                            status: 'HADIR'
                        });
                    } else {
                        displayItems.push({
                            type: 'absent',
                            name: user.name,
                            last_snapshot_path: null,
                            last_seen: null,
                            camera: '-',
                            status: 'BELUM TERDETEKSI HARI INI'
                        });
                    }
                });

                // Sort display items:
                // 1. HADIR (detected today) sorted by last_seen desc
                // 2. BELUM TERDETEKSI HARI INI sorted by name
                displayItems.sort((a, b) => {
                    if (a.status === 'HADIR' && b.status === 'HADIR') {
                        return new Date(b.last_seen) - new Date(a.last_seen);
                    }
                    if (a.status === 'HADIR') return -1;
                    if (b.status === 'HADIR') return 1;
                    return a.name.localeCompare(b.name);
                });

                const tbody = document.getElementById('users-table-body');
                if (displayItems.length > 0) {
                    const html = displayItems.map((item) => {
                        const cropPath = item.crop_snapshot_path || (item.last_snapshot_path ? item.last_snapshot_path.replace('.jpg', '_crop.jpg') : null);
                        const photoUrl = cropPath
                            ? encodeURI('/snapshots/' + cropPath) + '?t=' + new Date().getTime()
                            : 'https://ui-avatars.com/api/?name=' + encodeURIComponent(item.name) + '&background=e2e8f0&color=64748b';

                        let lastSeenStr = '-';
                        if (item.last_seen) {
                            const date = new Date(item.last_seen);
                            const now = new Date();
                            const diffInSeconds = Math.floor((now - date) / 1000);

                            let relativeText = '';
                            if (diffInSeconds < 60) {
                                relativeText = 'Baru saja';
                            } else if (diffInSeconds < 3600) {
                                const minutes = Math.floor(diffInSeconds / 60);
                                relativeText = `${minutes} menit yang lalu`;
                            } else {
                                const hours = Math.floor(diffInSeconds / 3600);
                                relativeText = `${hours} jam yang lalu`;
                            }

                            const timeStr = date.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }).replace(/\./g, ':');
                            lastSeenStr = `${timeStr} WIB <br> <span class="relative-time-text text-lg font-bold text-slate-400 mt-1 inline-block" data-time="${item.last_seen}">(${relativeText})</span>`;
                        }

                        let badgeClass = '';
                        if (item.status === 'HADIR') {
                            badgeClass = 'bg-emerald-100 text-emerald-700 border-emerald-300';
                        } else {
                            badgeClass = 'bg-slate-100 text-slate-500 border-slate-300';
                        }

                        return `
                        <tr class="hover:bg-slate-50 transition-colors">
                            <td class="w-32 text-center">
                                <img src="${photoUrl}" alt="Photo" class="w-32 h-40 object-cover object-top mx-auto shadow-sm">
                            </td>
                            <td class="w-1/2 px-6 py-8 text-2xl font-black text-slate-800 uppercase">${item.name}</td>
                            <td class="py-8 px-6 text-2xl font-bold text-slate-600 text-center">${lastSeenStr}</td>
                            <td class="py-8 px-6 text-2xl font-bold text-slate-600 text-center">${item.camera}</td>
                            <td class="w-48 py-8 px-6 text-center">
                                <span class="inline-flex px-4 py-2 text-xl font-bold uppercase tracking-wider rounded-lg border ${badgeClass}">
                                    ${item.status}
                                </span>
                            </td>
                        </tr>
                        `;
                    }).join('');

                    tbody.innerHTML = html;
                } else {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="5" class="px-6 py-12 text-center text-3xl font-bold text-slate-400">
                                BELUM ADA DATA LOG DETEKSI
                            </td>
                        </tr>
                    `;
                }

                // Toggle seamless scroll based on content height
                setTimeout(() => {
                    const scrollContainer = document.getElementById('scroll-container');
                    const table = document.getElementById('data-table');
                    const wrapper = document.getElementById('content-wrapper');

                    wrapper.style.animation = 'none';
                    wrapper.classList.remove('pause-scroll');

                    if (table.offsetHeight > scrollContainer.offsetHeight) {
                        const originalHeight = table.offsetHeight;
                        tbody.innerHTML = tbody.innerHTML + tbody.innerHTML;
                        const duration = originalHeight / 40; // 40px per second
                        wrapper.style.animation = `scroll-y ${duration}s linear infinite`;
                        wrapper.classList.add('pause-scroll');
                    }
                }, 100);

            } catch (e) {
                console.error(e);
                const tbody = document.getElementById('users-table-body');
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="px-6 py-12 text-center text-3xl font-bold text-red-500">
                            GAGAL MEMUAT DATA LOG DETEKSI
                        </td>
                    </tr>
                `;
            }
        }

        loadUsers();

        // Websocket for real-time updates
        let ws;
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws/display`);

            ws.onmessage = function (event) {
                const data = JSON.parse(event.data);
                if (data.event === 'refresh') {
                    loadUsers();
                }
            };

            ws.onclose = function () {
                // Try to reconnect in 5 seconds
                setTimeout(connectWebSocket, 5000);
            };
        }
        connectWebSocket();

        // Initial replacement for feather icons
        feather.replace();

        // Fullscreen API Logic
        const fullscreenBtn = document.getElementById('btn-fullscreen');

        function updateFullscreenIcon() {
            const icon = document.getElementById('fullscreen-icon');
            if (document.fullscreenElement) {
                icon.setAttribute('data-feather', 'minimize');
            } else {
                icon.setAttribute('data-feather', 'maximize');
            }
            feather.replace();
        }

        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) { /* Safari */
                    document.documentElement.webkitRequestFullscreen();
                } else if (document.documentElement.msRequestFullscreen) { /* IE11 */
                    document.documentElement.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        });

        document.addEventListener('fullscreenchange', updateFullscreenIcon);
        document.addEventListener('webkitfullscreenchange', updateFullscreenIcon);
        document.addEventListener('mozfullscreenchange', updateFullscreenIcon);
        document.addEventListener('MSFullscreenChange', updateFullscreenIcon);
    </script>
</body>

</html>
