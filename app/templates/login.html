{% extends "base.html" %}

{% block title %}Login - Smart Attendance{% endblock %}

{% block body %}
<div class="h-screen w-full flex items-center justify-center bg-slate-50 px-4">
    <div class="w-full max-w-sm bg-white border border-slate-200 rounded-2xl shadow-sm p-8">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Sign in</h1>
            <p class="text-xs text-slate-400 mt-1">Prototype Smart Attendance</p>
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <input type="text" id="username" required placeholder="Username" 
                    class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-slate-855 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-orange-500 focus:border-orange-500 text-sm transition-all">
            </div>
            
            <div>
                <input type="password" id="password" required placeholder="Password" 
                    class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-slate-855 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-orange-500 focus:border-orange-500 text-sm transition-all">
            </div>

            <div id="error-message" class="hidden text-red-600 text-xs font-medium text-center bg-red-50 py-2.5 px-3 rounded-xl border border-red-100"></div>

            <button type="submit" id="login-btn" 
                class="w-full py-3 bg-orange-600 hover:bg-orange-700 text-white rounded-xl font-semibold text-sm transition-colors flex justify-center items-center mt-6">
                <span>Sign in</span>
            </button>
        </form>
    </div>
</div>

<!-- Overriding main.js because we don't need sidebar on login -->
<script>
    const API_BASE = '/api';

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorEl = document.getElementById('error-message');
        const btn = document.getElementById('login-btn');

        errorEl.classList.add('hidden');
        btn.disabled = true;
        btn.innerHTML = '<div class="loader w-4 h-4 border-2"></div>';
        btn.classList.add('opacity-75', 'cursor-not-allowed');

        try {
            const formData = new URLSearchParams();
            formData.append('username', username);
            formData.append('password', password);

            const response = await fetch(`${API_BASE}/auth/login`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData.toString()
            });

            if (!response.ok) {
                throw new Error("Invalid username or password");
            }

            const data = await response.json();
            localStorage.setItem('token', data.access_token);
            
            // Redirect to dashboard
            window.location.href = '/live';
            
        } catch (error) {
            errorEl.textContent = error.message;
            errorEl.classList.remove('hidden');
            btn.disabled = false;
            btn.innerHTML = '<span>Sign in</span>';
            btn.classList.remove('opacity-75', 'cursor-not-allowed');
        }
    });

    // If already logged in, redirect to dashboard
    if (localStorage.getItem('token')) {
        window.location.href = '/live';
    }
</script>
{% endblock %}
